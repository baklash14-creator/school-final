<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choose a new password | Alfrian Int'l Academy &amp; Sec. Sch.</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 0% 0%,#17706a,#0e4d4a 50%,#08312f)">
    <div class="card auth-card">
      <form class="pane active" id="rf" novalidate>
        <div><h2>Choose a new password</h2></div>
        <p class="sub-line" id="rsub">Use at least 8 characters.</p>
        <div class="msg" id="rmsg" role="alert"></div>
        <div><label class="lbl" for="np">New password</label><div class="ctl"><span data-icon="lock"></span><input class="input" id="np" type="password" autocomplete="new-password" minlength="8" required></div></div>
        <div><label class="lbl" for="np2">Confirm password</label><div class="ctl"><span data-icon="lock"></span><input class="input" id="np2" type="password" autocomplete="new-password" minlength="8" required></div></div>
        <button class="btn primary go block" id="rgo" type="submit"><span class="lbl-txt">Update password</span><span class="spin"></span></button>
        <a class="link" href="login.html" style="justify-self:center;text-decoration:none">Back to sign in</a>
      </form>
    </div>
  </main>
  <script type="module">
    import { sb } from './js/supabase.js';
    import { icon, friendlyError, esc } from './js/ui.js';
    document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon, 18); el.style.display = 'contents'; });
    const msg = document.getElementById('rmsg');
    const say = (t, m) => { msg.className = `msg ${t} show`; msg.innerHTML = `<span>${esc(m)}</span>`; };
    let ready = false;
    sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY' || ev === 'SIGNED_IN') ready = true; });
    setTimeout(async () => { const { data } = await sb.auth.getSession(); ready = ready || !!data.session; if (!ready) say('err', 'This reset link is invalid or has expired. Request a new one from the sign-in page.'); }, 1200);
    document.getElementById('rf').addEventListener('submit', async (e) => {
      e.preventDefault();
      const a = document.getElementById('np').value, b = document.getElementById('np2').value, btn = document.getElementById('rgo');
      if (a.length < 8) return say('err', 'Use at least 8 characters.');
      if (a !== b) return say('err', 'The two passwords do not match.');
      btn.classList.add('loading');
      try { const { error } = await sb.auth.updateUser({ password: a }); if (error) throw error; say('ok', 'Password updated. Taking you to sign in...'); await sb.auth.signOut(); setTimeout(() => location.replace('login.html'), 1500); }
      catch (err) { say('err', friendlyError(err)); btn.classList.remove('loading'); }
    });
  </script>
</body>
</html>
